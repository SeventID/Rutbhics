<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rutbhics</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // Kunci desktop: tanpa sesi login, kembali ke halaman login.
  try {
    if (!sessionStorage.getItem("wd-session")) { location.replace("login.html"); }
  } catch (e) { /* abaikan: kunci demo, bukan pengaman sungguhan */ }
</script>
</head>
<body>
<div id="wallpaper"></div>

<!-- Ikon desktop -->
<div id="desktop-icons"></div>

<!-- Jendela -->
<div id="windows"></div>

<!-- Menu Start -->
<div id="start-menu" class="hidden">
  <input id="start-search" type="text" placeholder="Cari aplikasi...">
  <div id="start-grid"></div>
  <div id="start-user">
    <span id="start-username"></span>
    <button id="logout-btn">Keluar</button>
  </div>
</div>

<!-- Taskbar -->
<footer id="taskbar">
  <button id="start-btn" title="Mulai">⊞ <span id="start-btn-label">Mulai</span></button>
  <div id="task-buttons"></div>
  <button id="notif-btn" title="Notifikasi & pusat kontrol">🔔<span id="notif-badge" class="hidden">0</span></button>
  <div id="tray">
    <span id="clock-time">--:--</span>
    <span id="clock-date">--</span>
  </div>
</footer>

<!-- Panel notifikasi & pusat kontrol -->
<div id="notif-panel" class="hidden">
  <div class="notif-panel-head">
    <strong id="notif-title">Notifikasi</strong>
    <button id="notif-clear" class="chip">Hapus semua</button>
  </div>
  <div id="notif-list"></div>
  <div class="notif-panel-head" style="margin-top:14px">
    <strong id="cc-title">Pusat kontrol</strong>
  </div>
  <div class="control-row">
    <button id="cc-theme" class="chip">☀️ Ganti ke terang</button>
    <button id="cc-dnd" class="chip">🔔 Jangan ganggu: nonaktif</button>
  </div>
  <div class="control-row">
    <button id="cc-settings" class="btn-primary">Buka Pengaturan</button>
    <button id="cc-test" class="chip">Kirim notifikasi tes</button>
  </div>
</div>
<div id="toast-wrap"></div>

<script src="js/apps.js"></script>
<script src="js/desktop.js"></script>
</body>
</html>
