# Publish Rutbhics ke npm saat release GitHub diterbitkan.
# Memakai npm trusted publishing (OIDC) — tanpa token npm, tanpa 2FA.
# Syarat di sisi npm (npmjs.com -> package rutbhics -> Trusted Publisher):
#   Organization or user = SeventID, Repository = Rutbhics,
#   Workflow filename = publish.yml, Environment name = (kosong).
# Alur pakai: naikkan version di package.json, commit, lalu buat
# GitHub Release (tag mis. v1.0.1) -> workflow ini publish otomatis.
name: Publish ke npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # wajib untuk OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Tanpa npm install: package ini tanpa dependensi.
      - name: Pakai npm terbaru (dukungan OIDC)
        run: npm install -g npm@latest
      - name: Test (node --check + smoke server)
        run: npm test
      - name: Cek isi package (dry run)
        run: npm pack --dry-run
      - name: Publish ke npm
        run: npm publish --provenance --access public
